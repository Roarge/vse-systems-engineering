name: Plugin CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The full history, so the test-first check can find the merge
      # base of a pull request's range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate plugin manifest JSON
        run: |
          echo "Checking JSON syntax..."
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json

      - name: Check version consistency
        run: |
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          MARKET_VERSION=$(jq -r '.metadata.version' .claude-plugin/marketplace.json)
          echo "plugin.json version:      $PLUGIN_VERSION"
          echo "marketplace.json version: $MARKET_VERSION"
          if [ "$PLUGIN_VERSION" != "$MARKET_VERSION" ]; then
            echo "::error::Version mismatch: plugin.json ($PLUGIN_VERSION) != marketplace.json ($MARKET_VERSION)"
            exit 1
          fi

      - name: Validate plugin manifests with the Claude Code CLI
        env:
          CLAUDE_CODE_VERSION: 2.1.224
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          # Fail loudly rather than silently skipping if the pinned CLI
          # ever drops the subcommand.
          if ! claude plugin validate --help >/dev/null 2>&1; then
            echo "::error::claude plugin validate is unavailable in CLI ${CLAUDE_CODE_VERSION}"
            exit 1
          fi
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict .claude-plugin/marketplace.json

      - name: Lint hook and test scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck hooks/*.sh hooks/lib/*.sh tests/hooks/*.sh
          else
            echo "shellcheck not found, installing..."
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
            shellcheck hooks/*.sh hooks/lib/*.sh tests/hooks/*.sh
          fi

      - name: Check hook and test script conventions
        run: |
          # Every script in hooks/, hooks/lib/ and tests/hooks/ must be
          # executable and carry the shebang and failure mode the hook
          # conventions require. A non-executable or unguarded hook
          # fails silently at runtime, and a test script that does not
          # stop on the first error reports a pass it did not earn.
          EXIT_CODE=0
          for hook_file in hooks/*.sh hooks/lib/*.sh tests/hooks/*.sh; do
            if [ ! -x "$hook_file" ]; then
              echo "::error::$hook_file is not executable"
              EXIT_CODE=1
            fi
            if [ "$(head -1 "$hook_file")" != '#!/usr/bin/env bash' ]; then
              echo "::error::$hook_file does not start with #!/usr/bin/env bash"
              EXIT_CODE=1
            fi
            if ! grep -qF 'set -euo pipefail' "$hook_file"; then
              echo "::error::$hook_file does not set -euo pipefail"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

      - name: Validate skill structure
        run: |
          EXIT_CODE=0
          for skill_dir in skills/*/; do
            skill_file="${skill_dir}SKILL.md"
            skill_name=$(basename "$skill_dir")
            if [ ! -f "$skill_file" ]; then
              echo "::error::Missing SKILL.md in $skill_dir"
              EXIT_CODE=1
              continue
            fi
            if ! head -20 "$skill_file" | grep -q '^name:'; then
              echo "::error::$skill_file missing 'name:' in frontmatter"
              EXIT_CODE=1
            fi
            if ! head -20 "$skill_file" | grep -q '^description:'; then
              echo "::error::$skill_file missing 'description:' in frontmatter"
              EXIT_CODE=1
            fi
          done
          exit $EXIT_CODE

      - name: Check cross-references
        run: |
          # Every ${CLAUDE_PLUGIN_ROOT}/<path> reference in a
          # harness-loaded component must resolve inside the plugin
          # tree, because the whole committed tree is what reaches an
          # installer. A reference written as a file path is an error
          # when it does not resolve. A reference written as a
          # directory path (trailing slash) stays at warning level,
          # which preserves the tolerance the previous templates/
          # check provided for conditional directory copies.
          EXIT_CODE=0
          CHECKED=0
          for src_file in skills/*/SKILL.md commands/*.md agents/*.md hooks.json; do
            [ -f "$src_file" ] || continue
            for ref_path in $(grep -oP '\$\{CLAUDE_PLUGIN_ROOT\}/[a-zA-Z0-9_./-]+' "$src_file" 2>/dev/null | sort -u || true); do
              rel_path=$(echo "$ref_path" | sed 's|\${CLAUDE_PLUGIN_ROOT}/||')
              CHECKED=$((CHECKED + 1))
              [ -e "$rel_path" ] && continue
              case "$rel_path" in
                */)
                  echo "::warning::$src_file references directory $rel_path which does not exist"
                  ;;
                *)
                  echo "::error::$src_file references $rel_path which does not exist"
                  EXIT_CODE=1
                  ;;
              esac
            done
          done
          echo "Checked $CHECKED plugin-root references."
          exit $EXIT_CODE

      - name: Check wiki routing integrity
        run: |
          # Runtime knowledge reaches a skill through a generated
          # wiki-routing block, never through a concatenated bundle.
          # Four rules keep that true. The wiki/bundles directory was
          # deleted at 3.0.0, so any surviving reference is stale,
          # except inside vse-wiki-lint, which has to name the retired
          # surface in order to detect it. Markers inside fenced code
          # blocks are documentation examples and are skipped, per the
          # fenced-marker exclusion in wiki/CLAUDE.md.
          EXIT_CODE=0
          for src_file in skills/*/SKILL.md commands/*.md agents/*.md wiki/CLAUDE.md; do
            [ -f "$src_file" ] || continue
            if [ "$src_file" = "skills/vse-wiki-lint/SKILL.md" ]; then
              continue
            fi
            if grep -qF 'wiki/bundles' "$src_file"; then
              echo "::error::$src_file references the retired wiki/bundles surface"
              EXIT_CODE=1
            fi
          done
          for skill_file in skills/*/SKILL.md; do
            if grep -qE '^[[:space:]]*(`!cat|!`cat|!cat)[[:space:]]' "$skill_file"; then
              echo "::error::$skill_file carries a bundle embed line"
              EXIT_CODE=1
            fi
          done
          CHECKED=0
          for skill_file in skills/*/SKILL.md; do
            for page_path in $(awk '
              /^[[:space:]]*```/ { fenced = !fenced; next }
              fenced { next }
              /^[[:space:]]*<!-- wiki-routing:begin -->[[:space:]]*$/ { inblock = 1; next }
              /^[[:space:]]*<!-- wiki-routing:end -->[[:space:]]*$/ { inblock = 0; next }
              inblock && /^\|/ {
                n = split($0, cells, "|");
                if (n < 4) next;
                p = cells[3];
                gsub(/^[ \t]+|[ \t]+$/, "", p);
                if (p == "Path" || p ~ /^-+$/) next;
                print p;
              }' "$skill_file"); do
              CHECKED=$((CHECKED + 1))
              if [ ! -f "wiki/$page_path" ]; then
                echo "::error::$skill_file routes to wiki/$page_path which does not exist"
                EXIT_CODE=1
              fi
            done
          done
          for page_file in wiki/pages/*/*.md; do
            [ -f "$page_file" ] || continue
            if ! grep -q '^summary:' "$page_file"; then
              echo "::error::$page_file has no summary: in its frontmatter"
              EXIT_CODE=1
            fi
            if ! grep -q '^referenced_by:' "$page_file"; then
              echo "::error::$page_file has no referenced_by: in its frontmatter"
              EXIT_CODE=1
            fi
          done
          echo "Checked $CHECKED routing rows."
          exit $EXIT_CODE

      - name: Check ISO configuration files
        run: |
          # The placeholder check is an error from the pre-overhaul
          # hygiene release onwards, because the placeholder now exists.
          # The demo pin is an error from the demo sync (3.0.0-rc.15)
          # onwards: the pin is updated in each release's bump commit.
          if grep -qF '{{PLUGIN_VERSION}}' templates/iso-config/.iso-config.yaml; then
            echo "templates/iso-config/.iso-config.yaml carries the {{PLUGIN_VERSION}} placeholder."
          else
            echo "::error::templates/iso-config/.iso-config.yaml does not carry the {{PLUGIN_VERSION}} placeholder"
            exit 1
          fi
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          DEMO_VERSION=$(sed -n 's/^plugin_version:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' demo/smart-sensor/.iso-config.yaml)
          if [ -z "$DEMO_VERSION" ]; then
            echo "::error::demo/smart-sensor/.iso-config.yaml has no readable plugin_version"
            exit 1
          elif [ "$DEMO_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::demo/smart-sensor/.iso-config.yaml plugin_version ($DEMO_VERSION) does not match plugin.json ($PLUGIN_VERSION)"
            exit 1
          else
            echo "Demo plugin_version pin matches plugin.json ($PLUGIN_VERSION)."
          fi
          if grep -qE '^sysml_toolchain:' templates/iso-config/.iso-config.yaml; then
            echo "::error::templates/iso-config/.iso-config.yaml records an active sysml_toolchain; the shipped line is commented out so the absent-key default applies"
            exit 1
          elif grep -qE '^#[[:space:]]*sysml_toolchain:[[:space:]]*syside' templates/iso-config/.iso-config.yaml; then
            echo "templates/iso-config/.iso-config.yaml carries the commented sysml_toolchain default."
          else
            echo "::error::templates/iso-config/.iso-config.yaml does not carry the commented sysml_toolchain default"
            exit 1
          fi
          DEMO_TOOLCHAIN=$(sed -n 's/^sysml_toolchain:[[:space:]]*//p' demo/smart-sensor/.iso-config.yaml)
          case "$DEMO_TOOLCHAIN" in
            syside|omg-pilot|opensysml)
              echo "Demo sysml_toolchain is $DEMO_TOOLCHAIN."
              ;;
            *)
              echo "::error::demo/smart-sensor/.iso-config.yaml records sysml_toolchain '$DEMO_TOOLCHAIN', which is not one of syside, omg-pilot, opensysml"
              exit 1
              ;;
          esac
          # The test_first block and the four test-first and Gherkin
          # gates ship commented out, so a new project starts at the
          # profile defaults and records its own judgement. A commented
          # block is a "# <name>:" line followed by commented keys
          # indented two spaces or more, and it ends at the first other
          # line.
          if grep -qE '^(test_first|gate_overrides):' templates/iso-config/.iso-config.yaml; then
            echo "::error::templates/iso-config/.iso-config.yaml records an active test_first or gate_overrides block. Both ship commented out, so a new project starts at the profile defaults and records its own test-first judgement with /vse-test-first"
            exit 1
          fi
          MISSING=$(awk '
            BEGIN {
              n = split("test_first.applies test_first.rationale test_first.test_command test_first.scenario_command test_first.code_paths test_first.test_paths test_first.refactor_branches gate_overrides.precommit_gherkin gate_overrides.precommit_test_first gate_overrides.pretooluse_gherkin_first gate_overrides.pretooluse_test_first", want, " ")
            }
            /^# [a-z_][a-z_]*:[ \t]*$/ { block = $0; sub(/^# /, "", block); sub(/:.*/, "", block); next }
            block != "" && /^#[ \t][ \t][ \t]*[a-z_][a-z_]*:/ { key = $0; sub(/^#[ \t]*/, "", key); sub(/:.*/, "", key); seen[block "." key] = 1; next }
            { block = "" }
            END { sep = ""; for (i = 1; i <= n; i++) if (!(want[i] in seen)) { printf "%s%s", sep, want[i]; sep = " " } }' \
            templates/iso-config/.iso-config.yaml)
          if [ -n "$MISSING" ]; then
            echo "::error::templates/iso-config/.iso-config.yaml lacks these keys in its commented test_first and gate_overrides blocks: $MISSING"
            exit 1
          else
            echo "templates/iso-config/.iso-config.yaml carries the commented test_first block and the four test-first and Gherkin gates in its commented gate_overrides."
          fi

      - name: Check the demo mirrors
        run: |
          # The demo is a standalone project, so it carries
          # byte-identical copies of the methodology, the SysML
          # library, the renderers and the story lint. A change to one
          # side lands in the same commit as the other. A file pair is
          # compared with cmp. A directory pair is compared file by
          # file over the names git lists on either side (tracked
          # files, and untracked files that no .gitignore rule
          # ignores). So an OS or editor artefact or a bytecode cache,
          # which is ignored and never ships, is skipped, and a new
          # file that is not yet added still counts. A tracked file
          # missing from both sides is not a difference.
          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::check-mirrors lists files through git, so run it inside a git checkout"
            exit 1
          fi
          EXIT_CODE=0
          CHECKED=0
          for pair in \
            methodology:demo/smart-sensor/methodology \
            templates/common/library/vse-library.sysml:demo/smart-sensor/model/library/vse-library.sysml \
            templates/tools/render:demo/smart-sensor/tools/render \
            templates/tools/lint:demo/smart-sensor/tools/lint; do
            src=${pair%%:*}
            copy=${pair#*:}
            CHECKED=$((CHECKED + 1))
            if [ -d "$src" ]; then
              REPORT=$( { git -C "$src" ls-files -z -co --exclude-standard
                          git -C "$copy" ls-files -z -co --exclude-standard 2>/dev/null; } \
                | tr '\0' '\n' | LC_ALL=C sort -u | while IFS= read -r f; do
                  if [ ! -e "$src/$f" ] && [ ! -e "$copy/$f" ]; then
                    continue
                  elif [ ! -e "$copy/$f" ]; then
                    echo "Only in $src: $f"
                  elif [ ! -e "$src/$f" ]; then
                    echo "Only in $copy: $f"
                  elif ! cmp -s "$src/$f" "$copy/$f"; then
                    echo "Files $src/$f and $copy/$f differ"
                  fi
                done )
              [ -z "$REPORT" ] || { printf '%s\n' "$REPORT"; false; }
            else
              cmp "$src" "$copy"
            fi || {
              echo "::error::$src and $copy are not byte-identical"
              EXIT_CODE=1
            }
          done
          echo "Checked $CHECKED mirror pairs."
          exit $EXIT_CODE

      - name: Check that code changes arrive with tests
        env:
          VSE_PRECOMMIT_RANGE: ${{ github.event.pull_request.base.sha }}...${{ github.sha }}
        run: |
          # Test before code for the plugin itself. A pull request that
          # changes a code path named in tests/test-first.yaml shall
          # also change a test path. The range is the pull request's
          # base...the commit under test, so the check reads the
          # changes since their merge base. A push to main carries
          # changes that were checked as a pull request, so the step
          # is skipped there with a notice.
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "::notice::The test-first check runs on pull requests only, so it is skipped on this push."
            exit 0
          fi
          if ! bash tests/hooks/check-test-first.sh; then
            echo "::error::tests/hooks/check-test-first.sh found code changed with no test change, or could not read the range"
            exit 1
          fi

      - name: Check the SysML toolchain library
        run: |
          # Every toolchain is stubbed by the test, so the assertions
          # hold on this runner, which carries no SysML tool. The
          # real-tool section prints SKIPPED for each toolchain the
          # runner does not have installed.
          if ! bash tests/hooks/check-toolchain.sh; then
            echo "::error::tests/hooks/check-toolchain.sh reported a failing case"
            exit 1
          fi

      - name: Run the Python unit tests
        run: |
          # Standard library unittest only, because pytest is not
          # importable by python3 locally or on this runner.
          python3 -m unittest discover -s tests/python -t . -v

      - name: Run the plugin's Gherkin scenarios
        run: |
          # The standard-library runner in tests/bdd/. A scenario
          # tagged @wip is skipped. A directory that holds no .feature
          # file passes with a zero summary. The story lint then checks
          # the same files in syntax mode (F1, F2, F7, F8 and F9),
          # because they describe the plugin rather than a story and
          # carry no story tag.
          python3 tests/bdd/run.py tests/features
          python3 templates/tools/lint/story-wellformed.py --only syntax tests/features

      - name: Test the hook scripts
        run: |
          # Every tests/hooks/test-*.sh file runs, found by glob, so a
          # new hook test joins the suite by its file name alone. The
          # first failing file stops the run.
          for t in tests/hooks/test-*.sh; do
            if ! bash "$t"; then
              echo "::error::$t reported a failing case"
              exit 1
            fi
          done

      - name: Check the demo's generated artefacts
        run: |
          # Methodology section 9.8 Contract 3: the demo's
          # model-derived artefacts are regenerated here and shall
          # match what is committed. The renderers run from
          # demo/smart-sensor, because each one resolves the model
          # relative to the directory that holds the demo
          # configuration. The comparison runs from the repository
          # root, where the committed outputs live.
          (
            cd demo/smart-sensor
            python3 tools/render/traceability-matrix.py
            python3 tools/render/stakeholder-reqs-doc.py
            python3 tools/render/system-reqs-doc.py
          )
          if ! git diff --exit-code -- demo/smart-sensor/docs/generated/; then
            echo "::error::demo/smart-sensor/docs/generated/ is stale. Re-run the renderers and commit the result."
            exit 1
          fi
