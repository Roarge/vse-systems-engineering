name: Document Export

on:
  release:
    types: [published]

jobs:
  export:
    name: Generate Work Product Documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Create build directory
        run: mkdir -p build/diagrams

      - name: Export PM documents
        run: |
          for f in docs/pm/*.md; do
            filename=$(basename "$f" .md)
            echo "Exporting ${filename}..."
            pandoc "$f" -o "build/${filename}.docx" --from markdown --to docx
          done

      - name: Export SR documents
        run: |
          for f in docs/sr/*.md; do
            filename=$(basename "$f" .md)
            echo "Exporting ${filename}..."
            pandoc "$f" -o "build/${filename}.docx" --from markdown --to docx
          done

      - name: Resolve the SysML toolchain
        id: toolchain
        run: |
          # The same flat key the project-side hooks read: sysml_toolchain
          # in .iso-config.yaml, absent means syside. No YAML library.
          CONFIG=""
          for candidate in .iso-config.yaml engineering/.iso-config.yaml; do
              if [ -f "$candidate" ]; then CONFIG="$candidate"; break; fi
          done
          TOOLCHAIN=""
          if [ -n "$CONFIG" ]; then
              TOOLCHAIN=$(sed -n 's/^sysml_toolchain:[[:space:]]*//p' "$CONFIG" | head -n 1 | sed 's/[[:space:]]*#.*$//' | tr -d "\"' ")
          fi
          case "$TOOLCHAIN" in
              syside|omg-pilot|opensysml) ;;
              *)
                  if [ -n "$TOOLCHAIN" ]; then
                      echo "::warning::sysml_toolchain '${TOOLCHAIN}' is not recognised, using syside"
                  fi
                  TOOLCHAIN=syside
                  ;;
          esac
          echo "SysML toolchain: ${TOOLCHAIN}"
          echo "toolchain=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
          echo "VSE_SYSML_TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"

      - name: Set up Java 21 (for diagrams)
        if: steps.toolchain.outputs.toolchain == 'syside'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Syside CLI
        if: steps.toolchain.outputs.toolchain == 'syside'
        run: |
          mkdir -p ~/.local/bin
          # tar -xf syside-*.tar.xz -C ~/.local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        continue-on-error: true

      - name: Generate diagrams (Syside)
        if: steps.toolchain.outputs.toolchain == 'syside' && (hashFiles('syside.toml') != '' || hashFiles('engineering/syside.toml') != '')
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: |
          sudo apt-get install -y xvfb
          MODEL_DIR=model
          if [ -d engineering/model ]; then MODEL_DIR=engineering/model; fi
          xvfb-run -a syside viz view "$MODEL_DIR/" --output-dir build/diagrams
        continue-on-error: true

      - name: Generate diagrams (skipped)
        if: steps.toolchain.outputs.toolchain != 'syside'
        run: echo "Diagram generation skipped. ${{ steps.toolchain.outputs.toolchain }} has no diagram renderer in this workflow."

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: work-products-${{ github.event.release.tag_name }}
          path: build/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.docx
            build/diagrams/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
