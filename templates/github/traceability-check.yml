# Story-branch trace gate.
#
# Per methodology §8.5.4, every pull request lands a story (or a small
# coherent group of stories) on `main`. This workflow runs on every PR,
# on every push to `main` and on every release or baseline tag push, so
# that no story branch merges with broken `derive`, `frame concern`, or
# `verify` links, with a story that lacks its Gherkin feature file, or
# with code that arrived without its test. See
# `methodology/08-project-structure.md` §8.5 and §8.6 for the full PR
# review obligations and `methodology/iso-29110-hooks-guide.md` §4.4
# and §6 for the CI integration pattern.
#
# The workflow installs at every profile (hooks guide §3.4). How each
# step treats a finding:
#
#   - The commit-time gates step runs the project-side pre-commit hook
#     over the change under test. Every gate reads its disposition from
#     .iso-config.yaml (methodology §0.10.4), so the step carries no
#     continue-on-error toggle. The Gherkin and test-first gates block
#     at every profile until a recorded override lowers one (§11.9).
#   - Model validation and the Contract 3 freshness check block as
#     written, which is the `full` profile setting. A `light` or
#     `standard` install makes both advisory by uncommenting the
#     `continue-on-error: true` line in each of the two steps.
#   - The test and scenario steps run `test_first.test_command` and
#     `test_first.scenario_command` when the project records them
#     (methodology §11.8). A failing test fails the workflow at every
#     profile.
#
# Translating to GitLab CI, Forgejo Actions, or Gitea Actions: check
# out the full history, set VSE_PRECOMMIT_RANGE to the change under
# test (base...head for a merge request, before..after for a push, and
# `all` for a tag), and invoke the project-side `pre-commit` hook from
# `<project>/.githooks/`, which orchestrates the gates internally, from
# your host's pipeline. The hook is host-agnostic plain bash.

name: SysML Validation (story-branch trace gate)

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main]
    tags: ['release-*', 'plan-baseline-*']

jobs:
  validate:
    name: Validate SysML 2.0 Models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # The full history, because the commit-time gates read the
        # range of commits a pull request or a push brings, and the
        # test-first gate looks for the merge base (hooks guide §4.4).
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the SysML toolchain
        id: toolchain
        run: |
          # The same flat key the project-side hooks read: sysml_toolchain
          # in .iso-config.yaml, absent means syside. No YAML library.
          CONFIG=""
          for candidate in .iso-config.yaml engineering/.iso-config.yaml; do
              if [ -f "$candidate" ]; then CONFIG="$candidate"; break; fi
          done
          TOOLCHAIN=""
          if [ -n "$CONFIG" ]; then
              TOOLCHAIN=$(sed -n 's/^sysml_toolchain:[[:space:]]*//p' "$CONFIG" | head -n 1 | sed 's/[[:space:]]*#.*$//' | tr -d "\"' ")
          fi
          case "$TOOLCHAIN" in
              syside|omg-pilot|opensysml) ;;
              *)
                  if [ -n "$TOOLCHAIN" ]; then
                      echo "::warning::sysml_toolchain '${TOOLCHAIN}' is not recognised, using syside"
                  fi
                  TOOLCHAIN=syside
                  ;;
          esac
          echo "SysML toolchain: ${TOOLCHAIN}"
          echo "toolchain=${TOOLCHAIN}" >> "$GITHUB_OUTPUT"
          echo "VSE_SYSML_TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"

      - name: Set up Java 21
        # The OMG pilot runs on a JVM and is the runner-side fallback for syside. OpenSysML is a static binary.
        if: steps.toolchain.outputs.toolchain != 'opensysml'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache the OMG SysML v2 Pilot Implementation
        # Installed for omg-pilot, and as the runner-side fallback for
        # syside (a Solo licence does not cover CI). 126 MB, so cached.
        if: steps.toolchain.outputs.toolchain != 'opensysml'
        id: pilot-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/sysml-pilot
          key: sysml-pilot-2026-07-jupyter-sysml-kernel-0.61.0

      - name: Install the OMG SysML v2 Pilot Implementation (release 2026-07)
        if: steps.toolchain.outputs.toolchain != 'opensysml' && steps.pilot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          PILOT_HOME="$HOME/.local/share/sysml-pilot"
          mkdir -p "$PILOT_HOME"
          curl -fsSL -o "$PILOT_HOME/jupyter-sysml-kernel-0.61.0.zip" \
            https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation/releases/download/2026-07/jupyter-sysml-kernel-0.61.0.zip
          # The release publishes no checksum file. Computed from the
          # 126,125,572-byte artefact on 2026-09-09.
          echo "3d310efb8a5332b11ec2441697d40ae10e7e04cfb8c8d121c198ffba38229ada  $PILOT_HOME/jupyter-sysml-kernel-0.61.0.zip" | sha256sum -c -
          unzip -q -o "$PILOT_HOME/jupyter-sysml-kernel-0.61.0.zip" -d "$PILOT_HOME"
          rm -f "$PILOT_HOME/jupyter-sysml-kernel-0.61.0.zip"

      - name: Install OpenSysML v0.6.0
        if: steps.toolchain.outputs.toolchain == 'opensysml'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/opensysml-linux-amd64.tar.gz \
            https://github.com/Open-MBEE/OpenSysML/releases/download/v0.6.0/opensysml-linux-amd64.tar.gz
          # From the release's SHA256SUMS.txt.
          echo "15d4a2d12a0adaadcbb1ed53946061a113c793e60a9e159b790936938323fc38  /tmp/opensysml-linux-amd64.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/opensysml-linux-amd64.tar.gz -C "$HOME/.local/bin" sysml sysml-lsp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Syside CLI
        if: steps.toolchain.outputs.toolchain == 'syside'
        run: |
          # Download and extract the syside CLI. Adjust the URL and
          # version for your licence. Without it the validation step
          # falls back to the pilot installed above and says so.
          mkdir -p ~/.local/bin
          # tar -xf syside-*.tar.xz -C ~/.local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate models
        # One call site for all three toolchains: the library the
        # pre-commit hook sources, in its executable form. It runs the
        # recorded preference, falls back along the fixed order, and
        # prints why. Blocking as written (full profile). A light or
        # standard install makes it advisory by uncommenting
        # continue-on-error (methodology §0.10.4).
        # continue-on-error: true
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
          VSE_TC_TAG: ci
        run: |
          set -euo pipefail
          LIB=""
          for candidate in .githooks/lib/sysml-toolchain.sh hooks/lib/sysml-toolchain.sh; do
              if [ -x "$candidate" ]; then LIB="$candidate"; break; fi
          done
          if [ -z "$LIB" ]; then
              echo "::warning::.githooks/lib/sysml-toolchain.sh is not installed (run @attention-regime). Model validation skipped."
              exit 0
          fi
          FILES=()
          while IFS= read -r f; do
              case "$f" in */sandbox/*|sandbox/*|*.draft.sysml|build/*|*/build/*) continue ;; esac
              FILES+=("$f")
          done < <(git ls-files -- '*.sysml')
          if [ "${#FILES[@]}" -eq 0 ]; then
              echo "No .sysml files tracked. Nothing to validate."
              exit 0
          fi
          rc=0
          "$LIB" validate "${FILES[@]}" || rc=$?
          case "$rc" in
              0) echo "Model validation clean (${#FILES[@]} files)." ;;
              1) echo "::error::Model validation reported findings (see the lines above)."; exit 1 ;;
              *) echo "::error::No SysML toolchain ran on the runner (see the reasons above)."; exit 1 ;;
          esac

      - name: Check formatting (Syside)
        if: steps.toolchain.outputs.toolchain == 'syside' && (hashFiles('syside.toml') != '' || hashFiles('engineering/syside.toml') != '')
        env:
          SYSIDE_LICENSE_KEY: ${{ secrets.SYSIDE_LICENSE_KEY }}
        run: syside format --check
        continue-on-error: true

      - name: Check formatting (skipped)
        if: steps.toolchain.outputs.toolchain != 'syside'
        run: echo "Formatting check skipped. ${{ steps.toolchain.outputs.toolchain }} has no formatter (only Syside ships one)."

      - name: Run the commit-time gates over the change
        # The project-side pre-commit hook from .githooks/ in range mode
        # (methodology §11.9.2, hooks guide §4.1). A fresh checkout has
        # nothing staged, so the hook reads the files that
        # VSE_PRECOMMIT_RANGE names instead: a pull request's changes
        # since its base, a push's changes since the previous tip, or
        # every tracked file (all) for a tag push and for a push whose
        # previous tip this checkout does not hold. It runs story
        # well-formedness (§1.9), Gherkin conformance (§11.9.1, which
        # checks Contract 2 per criterion as finding S8), test before
        # code, and traceability integrity. It skips its SysML lint in
        # range mode, because the validation step above covers the
        # model. Every gate reads its disposition from .iso-config.yaml,
        # so this step has no continue-on-error toggle at any profile.
        env:
          CI: true
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ ! -x .githooks/pre-commit ]; then
              echo "::error::.githooks/pre-commit is missing or not executable (run @attention-regime), so the commit-time gates did not run."
              exit 1
          fi
          RANGE=all
          WHAT="every tracked file"
          case "$GITHUB_EVENT_NAME" in
              pull_request)
                  RANGE="${PR_BASE_SHA}...${PR_HEAD_SHA}"
                  WHAT="the pull request's changes since its base"
                  ;;
              push)
                  case "$GITHUB_REF" in
                      refs/tags/*)
                          WHAT="every tracked file, because a tag push brings no range of changes"
                          ;;
                      *)
                          # A previous tip of all zeros means the push
                          # created the branch.
                          case "$PUSH_BEFORE" in
                              *[!0]*)
                                  if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                                      RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
                                      WHAT="the push's changes since the previous tip"
                                  else
                                      WHAT="every tracked file, because this checkout does not hold the previous tip ${PUSH_BEFORE}"
                                  fi
                                  ;;
                              *)
                                  WHAT="every tracked file, because the push has no previous tip"
                                  ;;
                          esac
                          ;;
                  esac
                  ;;
          esac
          echo "The commit-time gates read ${WHAT} (VSE_PRECOMMIT_RANGE=${RANGE})."
          if ! VSE_PRECOMMIT_RANGE="$RANGE" .githooks/pre-commit; then
              echo "::error::A commit-time gate stopped the change, or the hook could not read the range (see the lines above)."
              exit 1
          fi

      - name: Read the test-first record
        # test_command and scenario_command from the test_first block of
        # .iso-config.yaml (methodology §11.5.2), read through the
        # profile library the hooks use, so that CI and the hooks agree
        # on quoting and comments. A command that is not recorded
        # leaves its step below skipped.
        id: test-first
        run: |
          set -euo pipefail
          LIB=""
          for candidate in .githooks/lib/iso-profile.sh hooks/lib/iso-profile.sh; do
              if [ -r "$candidate" ]; then LIB="$candidate"; break; fi
          done
          if [ -z "$LIB" ]; then
              echo "::warning::.githooks/lib/iso-profile.sh is not installed (run @attention-regime), so test_command and scenario_command were not read and no test ran."
              exit 0
          fi
          # shellcheck source=/dev/null
          . "$LIB"
          TEST_COMMAND="$(iso_section_scalar test_first test_command)"
          SCENARIO_COMMAND="$(iso_section_scalar test_first scenario_command)"
          echo "test_first.test_command: ${TEST_COMMAND:-not recorded}"
          echo "test_first.scenario_command: ${SCENARIO_COMMAND:-not recorded}"
          {
              echo "test_command=${TEST_COMMAND}"
              echo "scenario_command=${SCENARIO_COMMAND}"
          } >> "$GITHUB_OUTPUT"

      - name: Run the recorded tests (test_command)
        # Runs when test_first records test_command (methodology §11.7
        # and §11.8), from the top-level directory of the repository,
        # the directory that code_paths and test_paths are relative to.
        # A failing test fails the workflow at every profile. Add any
        # set-up step the command needs, such as actions/setup-python,
        # above this step.
        if: steps.test-first.outputs.test_command != ''
        env:
          TEST_COMMAND: ${{ steps.test-first.outputs.test_command }}
        run: |
          set -euo pipefail
          echo "Running test_first.test_command: ${TEST_COMMAND}"
          if ! bash -c "$TEST_COMMAND"; then
              echo "::error::test_first.test_command failed. Run '${TEST_COMMAND}' locally and make the failing tests pass (methodology §11.7)."
              exit 1
          fi

      - name: Run the recorded scenarios (scenario_command)
        # Runs when test_first records scenario_command (methodology
        # §11.8), from the same directory as the tests. The runner reads
        # the feature files beside the stories, in its strict mode, so
        # an undefined or pending step fails. A failing scenario fails
        # the workflow at every profile.
        if: steps.test-first.outputs.scenario_command != ''
        env:
          SCENARIO_COMMAND: ${{ steps.test-first.outputs.scenario_command }}
        run: |
          set -euo pipefail
          echo "Running test_first.scenario_command: ${SCENARIO_COMMAND}"
          if ! bash -c "$SCENARIO_COMMAND"; then
              echo "::error::test_first.scenario_command failed. Run '${SCENARIO_COMMAND}' locally and make the failing scenarios pass (methodology §11.8)."
              exit 1
          fi

      - name: Check derived-artefact freshness (Contract 3)
        # Per `methodology/iso-29110-hooks-guide.md` §4.4 Contract 3, the
        # artefacts regenerated from the pushed tree shall match the copies
        # committed under `docs/generated/`. A mismatch means a model change
        # landed without its rendered artefacts, which is the one way
        # documentation drift can still happen under §9.8.
        #
        # Disposition per hooks guide §3.4 and methodology §0.10.4. The
        # step is blocking as written, which is the `full` profile
        # setting. A `light` or `standard` profile install makes it
        # advisory by uncommenting the `continue-on-error` line below.
        # continue-on-error: true
        run: |
          set -euo pipefail

          # The directory that holds the config is the engineering root,
          # which is either the repository root or engineering/ under a
          # brownfield scaffold. Renderer paths, renderer working
          # directory, and derived artefacts all resolve from there, as
          # they do in the project-side post-merge hook.
          ISO_CONFIG=""
          ENG_ROOT=""
          if [ -f ".iso-config.yaml" ]; then
              ISO_CONFIG=".iso-config.yaml"
              ENG_ROOT="."
          elif [ -f "engineering/.iso-config.yaml" ]; then
              ISO_CONFIG="engineering/.iso-config.yaml"
              ENG_ROOT="engineering"
          fi

          if [ -z "$ISO_CONFIG" ]; then
              echo "No .iso-config.yaml found. Nothing to regenerate."
              exit 0
          fi

          # The same awk idiom as the project-side post-merge hook, so that
          # both read the renderers: block the same way. Renderer paths are
          # constrained to start with tools/render/ to prevent arbitrary
          # command execution from a project-controlled YAML file.
          RENDERERS=$(awk '
              /^renderers:/ { inside=1; next }
              inside && /^[A-Za-z]/ { inside=0 }
              inside && /^[[:space:]]+[a-z_]+:[[:space:]]+/ {
                  sub(/^[[:space:]]+[a-z_]+:[[:space:]]+/, "")
                  print
              }
          ' "$ISO_CONFIG")

          DREW=0
          while IFS= read -r renderer; do
              [ -z "$renderer" ] && continue
              case "$renderer" in
                  *..*)
                      echo "::warning::Skipping renderer with unsafe path: ${renderer}"
                      echo "Renderer paths shall not contain .. segments."
                      continue
                      ;;
                  tools/render/*) ;;
                  *)
                      echo "::warning::Skipping renderer with unsafe path: ${renderer}"
                      echo "Renderer paths shall start with tools/render/."
                      continue
                      ;;
              esac
              if [ -x "$ENG_ROOT/$renderer" ]; then
                  DREW=1
                  echo "Running ${renderer}"
                  # The renderer discovers model/ relative to its working
                  # directory, so run it from the engineering root.
                  ( cd "$ENG_ROOT" && "./$renderer" )
              else
                  echo "::warning::Configured renderer ${renderer} is absent or not executable."
              fi
          done <<< "$RENDERERS"

          if [ "$DREW" -eq 0 ]; then
              echo "No renderer ran. Nothing to compare."
              exit 0
          fi

          # Record any artefact that is new in this run, so that a first
          # rendering counts as a difference rather than passing unseen.
          git add --intent-to-add -- "$ENG_ROOT/docs/generated/" 2>/dev/null || true

          if git diff --exit-code -- "$ENG_ROOT/docs/generated/"; then
              echo "Derived artefacts are current."
          else
              echo "::error::Derived artefacts under the engineering root's docs/generated/ are stale. Regenerate them with the scripts in the engineering root's tools/render/ and commit the result (methodology §9.8, hooks guide Contract 3)."
              exit 1
          fi

      - name: Report results
        if: failure()
        run: |
          echo "::error::Model validation, a commit-time gate, or a recorded test failed."
          echo "Run '.githooks/lib/sysml-toolchain.sh validate <files>', 'VSE_PRECOMMIT_RANGE=origin/main...HEAD .githooks/pre-commit', the recorded test_command and '@traceability-guard' locally to identify and fix issues."
