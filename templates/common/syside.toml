# Syside configuration for {{PROJECT_NAME}}
# Reference: https://docs.sensmetry.com/modeler/cli/configuration.html
#
# Syside reads three configuration levels, lowest precedence first:
#   1. Global:   $XDG_CONFIG_HOME/syside/syside.toml
#   2. Project:  this file, committed and shared by the whole team
#   3. Personal: syside.user.toml beside this file, gitignored
# Tables merge key by key, scalars and arrays overwrite, and `exclude`
# concatenates across all three levels. Put project-wide rules here and
# leave syside.user.toml for one engineer's local overrides.
#
# The project root is found by walking up to a `.git` directory or a
# `sysand-lock.toml` file.

# Standard library path (omit to use bundled version)
# std = "/path/to/standard/library"

# Additional files or directories to include (glob patterns supported)
# include = ["external/**/*.sysml"]

# Files or directories to exclude
exclude = [
  "build/**",
  "*.draft.sysml",
]

[format]
# Visual column limit for line wrapping (default: 100)
line-width = 100

# Spaces per indentation level (default: 4)
tab-width = 4

# Use tabs instead of spaces (default: false)
tabs = false

# Treat comments as Markdown (default: true)
markdown = true

# Remove unnecessary identifier quotes (default: true)
strip-unnecessary-quotes = true

# Style for empty children blocks: "braces" ({}) or "semicolon" (;)
empty-brackets = "braces"

[format.breaks]
# Force children elements onto new lines (default: false)
force-bodies = false

# Operator placement on line break: "after" or "before"
operator = "after"

[lint]
# Severity per diagnostic rule.
# Options: "error", "warning", "information", "hint", "off"

# Package name colliding with the standard library
standard-library-package = "warning"

# The remaining five rules keep the tool default until set here.
# Uncomment a line to pin the severity for this project.
# type-error = "error"
# usage-feature-typing = "error"
# global-namespace-distinguishability = "warning"
# quantity-operator-expression = "warning"
# related-feature-conformance = "warning"

[lsp]
# Maximum number of autocomplete suggestions (default: 256)
completion-limit = 256

# Editable file tiers: "project", "external", or "all" (default: "project")
edit = "project"

[telemetry]
# Crash reporting: "ignore" (default) or "upload"
crash-reports = "ignore"
