# .iso-config.yaml: ISO 29110 hook configuration
#
# This file drives the project-side and lifecycle hooks shipped by the
# vse-systems-engineering plugin. Place at the project root (or under
# engineering/ for brownfield layout). The hooks read this file to
# decide what to enforce.
#
# Push project-specific behaviour into this file rather than into the
# hook scripts. The scripts are stable across projects, the
# configuration varies.

# Plugin version recorded at /vse-setup time. Compared by the audit.
plugin_version: "{{PLUGIN_VERSION}}"

# Project rigour profile per methodology section 0.10.
# One of: light | standard | full. Absent means standard.
project_profile: standard

# Optional per-gate overrides: block | warn | off.
# Unset keys follow the profile default (section 0.10.4).
# gate_overrides:
#   commit_msg_pattern: warn
#   commit_msg_cr_reference: block
#   precommit_lint: warn
#   precommit_story_wellformed: off
#   precommit_traceability: warn

# Paths under Change Request protection. Edits to any path on this
# list (or any path beneath a directory entry) require an open
# Change Request issue and a "(CR #<n>)" reference in the commit
# message.
#
# The list below is the standard-profile default. The other two
# profile defaults are:
#
#   light:  baselined_paths: []
#           (empty, so the Change Request machinery stays dormant)
#
#   full:   baselined_paths:
#             - docs/project-plan.md
#             - docs/cm-strategy.md
#             - docs/risk-register.md
#             - docs/disposal-management-approach.md
#             - model/library/
#
# methodology/ is deliberately absent at every profile. Change Request
# protection on the project-local methodology copy contradicts the
# override convention that makes the copy useful, and methodology
# branches plus pull-request review already control changes to it. A
# project under formal assessment may add it back explicitly and
# record the addition on its tailoring line.
baselined_paths:
  - docs/project-plan.md

# Branches that the plugin treats as protected. Force-push is
# prohibited on these and additional review gates apply.
protected_branches:
  - main
  - release/*

# StoryMeta fields that every story shall carry once it leaves backlog.
# The list below is the standard-profile default. The other two
# profile defaults are:
#
#   light:  required_fields: [status]
#   full:   required_fields: [points, priority, status]
storymeta:
  required_fields: [status, priority]
  valid_statuses: [backlog, ready, inProgress, done]

# Risk Register configuration.
risk_register:
  path: docs/risk-register.md
  stale_threshold_days: 30

# Change Request configuration.
change_request:
  issue_label: change-request
  required_for_paths: ${baselined_paths}

# Renderers for section 9.8 model-derived artefacts. Each path is an
# executable script invoked by the post-merge hook on main.
#
# Uncomment when the project authors these scripts under tools/render/.
# Until then the block stays commented out, because a configured path
# to a script that does not exist makes the post-merge hook report a
# failure the project cannot act on.
# renderers:
#   traceability_matrix: tools/render/traceability-matrix.py
#   stakeholder_reqs:    tools/render/stakeholder-reqs-doc.py
#   system_reqs:         tools/render/system-reqs-doc.py
#   ivv_plan:            tools/render/ivv-plan.py
#   ivv_procedures:      tools/render/ivv-procedures.py
#   justification:       tools/render/justification-doc.py
