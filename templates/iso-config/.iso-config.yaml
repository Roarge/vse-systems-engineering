# .iso-config.yaml: ISO/IEC 29110 hook configuration
#
# This file drives the project-side and lifecycle hooks shipped by the
# vse-systems-engineering plugin. Place at the project root (or under
# engineering/ for brownfield layout). The hooks read this file to
# decide what to enforce.
#
# Push project-specific behaviour into this file rather than into the
# hook scripts. The scripts are stable across projects, the
# configuration varies.

# Plugin version recorded at /vse-setup time. Compared by the audit.
plugin_version: "{{PLUGIN_VERSION}}"

# Project rigour profile per methodology section 0.10.
# One of: light | standard | full. Absent means standard.
project_profile: standard

# SysML v2 toolchain the project-side hooks and the CI templates validate
# with. One of:
#   syside     Sensmetry Syside CLI (commercial licence, formatter and LSP)
#   omg-pilot  OMG SysML v2 Pilot Implementation (EPL-2.0, Java 21 or later)
#   opensysml  Open-MBEE OpenSysML (Apache-2.0, static binary, LSP)
# Absent means syside. When the preferred tool is unavailable (not
# installed, licence expired, no Java 21) the hooks fall back along the
# fixed order syside, omg-pilot, opensysml and print one notice naming
# why. VSE_SYSML_TOOLCHAIN in the environment overrides this for one run.
# The line below ships commented out, so a project that makes no choice
# leaves the key absent and the audit invites the decision. @project-setup
# uncomments it and writes the recorded value when the engineer chooses.
# sysml_toolchain: syside

# Optional per-gate overrides: block | warn | info | off.
# Unset keys follow the profile default (section 0.10.4).
# The last four gates (Gherkin first and test first, section 11.9)
# block at every profile. Lowering one is a tailoring decision, recorded
# with its reason on the tailoring line of the Project Plan, and an
# agent never writes such an override without an explicit human request
# (section 11.10).
# gate_overrides:
#   commit_msg_pattern: warn
#   commit_msg_cr_reference: block
#   precommit_lint: warn
#   precommit_story_wellformed: off
#   precommit_traceability: warn
#   precommit_gherkin: block
#   precommit_test_first: block
#   pretooluse_gherkin_first: block
#   pretooluse_test_first: block

# Test-first record per methodology section 11.5: whether test first
# applies to this project, and which paths hold its code and its tests.
# The block ships commented out, so a new project starts with the
# judgement unrecorded. /vse-test-first makes the judgement with the
# engineer and records it here, in CLAUDE.md, in the SEMP and in the
# Project Plan (section 11.5.3). While it is unrecorded, the commit-time
# test-first gate asks for the record when it detects test tooling or a
# change to code. The values below describe a project with Python code.
# A project with no implementation code records applies: false and a
# rationale that says so. applies: true requires code_paths, test_paths
# and test_command. CI runs test_command and scenario_command, when
# recorded, from the top-level directory of the git repository.
# test_first:
#   applies: true          # true | false, judgement per section 11.5
#   rationale: "pytest under tests/. bash scripts: bats viable. SysML: not viable, no execution runtime."
#   test_command: "pytest -q"
#   scenario_command: "behave model/core/stories"   # optional
#   code_paths: [src/*, scripts/*.sh]               # globs relative to the git toplevel
#   test_paths: [tests/*]
#   refactor_branches: [refactor/*]                 # absent means [refactor/*]

# Paths under Change Request protection. Edits to any path on this
# list (or any path beneath a directory entry) require an open
# Change Request issue and a "(CR #<n>)" reference in the commit
# message.
#
# The list below is the standard-profile default. The other two
# profile defaults are:
#
#   light:  baselined_paths: []
#           (empty, so the Change Request machinery stays dormant)
#
#   full:   baselined_paths:
#             - docs/project-plan.md
#             - docs/cm-strategy.md
#             - docs/risk-register.md
#             - docs/disposal-management-approach.md
#             - model/library/
#
# methodology/ is deliberately absent at every profile. Change Request
# protection on the project-local methodology copy contradicts the
# override convention that makes the copy useful, and methodology
# branches plus pull-request review already control changes to it. A
# project under formal assessment may add it back explicitly and
# record the addition on its tailoring line.
baselined_paths:
  - docs/project-plan.md

# Branches that the plugin treats as protected. Force-push is
# prohibited on these and additional review gates apply.
protected_branches:
  - main
  - release/*

# StoryMeta fields that every story shall carry once it leaves backlog.
# The list below is the standard-profile default. The other two
# profile defaults are:
#
#   light:  required_fields: [status]
#   full:   required_fields: [points, priority, status]
storymeta:
  required_fields: [status, priority]
  valid_statuses: [backlog, ready, inProgress, done]

# Risk Register configuration.
risk_register:
  path: docs/risk-register.md
  stale_threshold_days: 30

# Change Request configuration.
change_request:
  issue_label: change-request
  required_for_paths: ${baselined_paths}

# Renderers for section 9.8 model-derived artefacts. Each path is an
# executable script invoked with no arguments from the directory that
# holds this file, which is the engineering root, by the post-merge hook
# on main and by the Contract 3 freshness check in CI. Every path shall
# start with tools/render/, which is the constraint the post-merge hook
# applies so that a project-controlled YAML file cannot name an
# arbitrary command, and no path may contain a .. segment, which would
# escape the prefix.
#
# The three keys below are the renderers the plugin ships and
# @project-setup installs under tools/render/. Comment out any key whose
# script the project removes, because a configured path to a script that
# does not exist leaves that artefact silently unregenerated.
renderers:
  traceability_matrix: tools/render/traceability-matrix.py
  stakeholder_reqs:    tools/render/stakeholder-reqs-doc.py
  system_reqs:         tools/render/system-reqs-doc.py

# The remaining section 9.8 artefacts have no renderer yet. Those scripts
# do not ship, so their keys stay commented out until the project authors
# them under tools/render/. A configured path to a script that does not
# exist makes the post-merge hook report a failure the project cannot act
# on.
#   ivv_plan:            tools/render/ivv-plan.py
#   ivv_procedures:      tools/render/ivv-procedures.py
#   justification:       tools/render/justification-doc.py
